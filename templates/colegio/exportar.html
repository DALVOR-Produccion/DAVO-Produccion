{% extends 'base.html' %}

{% block content %}

<div class="card">
    <h2>Descargar datos en Excel</h2>

    <p><strong>Establecimiento:</strong> {{ school_name }}</p>

    <p>
        El archivo incluirá solamente las evaluaciones correspondientes a este
        establecimiento y contendrá una hoja de detalle y otra de resumen.
    </p>

    <form method="POST" action="{{ url_for('colegio.exportar') }}">
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:8px;">
                <input type="radio" name="periodo" value="actual" checked>
                Año actual ({{ current_year }})
            </label>

            <label style="display:block; margin-bottom:8px;">
                <input type="radio" name="periodo" value="especifico">
                Año específico
            </label>

            <select name="anio" style="max-width:220px; margin:0 0 12px 24px;">
                {% for anio in anios %}
                    <option value="{{ anio }}">{{ anio }}</option>
                {% endfor %}
            </select>

            <label style="display:block; margin-bottom:8px;">
                <input type="radio" name="periodo" value="historico">
                Histórico completo
            </label>
        </div>

        <button type="submit" class="btn">
            Generar y descargar Excel
        </button>

        <a href="{{ url_for('colegio.dashboard') }}" class="btn btn-secondary">
            Volver al panel
        </a>
    </form>
</div>

{% endblock %}
